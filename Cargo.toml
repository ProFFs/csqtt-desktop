[workspace]
resolver = "2"
members = ["backend", "gui"]

# [CSQTT-DESKTOP] Вендорные патчи (унаследованы от сборки focsq): primp и
# netstack-smoltcp правятся локально, поэтому патчи объявлены в корне
# workspace — в манифестах участников они игнорируются.
[patch.crates-io]
primp = { path = "backend/vendor/primp" }
netstack-smoltcp = { path = "backend/vendor/netstack-smoltcp" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"