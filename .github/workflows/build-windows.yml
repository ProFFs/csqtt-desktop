name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [desktop]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain 1.97.1 (MSVC)
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: UI-тесты (egui_kittest, headless)
        run: cargo test -p csqtt-desktop
      - name: Build release
        run: cargo build --release -p csqtt-desktop
      - name: Verify embedded wintun
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/csqtt-desktop.exe)) { Write-Error 'exe missing'; exit 1 }
          if (-not (Test-Path gui/assets/wintun.dll)) { Write-Error 'gui/assets/wintun.dll missing (встроен в exe)'; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: csqtt-desktop-win64
          path: target/release/csqtt-desktop.exe
          if-no-files-found: error