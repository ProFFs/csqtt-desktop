[package]
name = "csqtt-desktop"
version = "1.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
anyhow = "1.0.104"
csqtt-core = { path = "../backend" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
primp = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7.19"